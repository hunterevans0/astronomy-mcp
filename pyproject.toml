[project]
name = "astronomy-mcp"
version = "0.3.0"
description = "MCP server for astronomy: catalogs, sky positions, observing plans, light pollution, terrain, sky conditions, space weather and launches"
readme = "README.md"
authors = [
    { name = "Hunter Evans", email = "moab@flibit.com" }
]
requires-python = ">=3.13"
dependencies = [
    "astronomy-engine>=2.1.19",
    "httpx>=0.28.1",
    "mcp[cli]>=2.2.0",
    "pillow>=12.3.0",
    "tzdata>=2026.4",
]

[project.scripts]
astronomy-mcp = "astronomy_mcp:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits real upstream services such as SIMBAD, VSX and OpenNGC (deselected by default)"]
addopts = "-m 'not live'"
